services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursehub-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-base_course_api}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-super-secure-long-random-local-secret-for-coursehub-api-auth-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: coursehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-base_course_api}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-base_course_api}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
